# ── Profile: prod (PostgreSQL) ───────────────────────────────────────────────
# Valores padrão — sobrescreva via variáveis de ambiente no Kubernetes:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-service:5432/gerenciador_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gerenciador}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gerenciador123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false
