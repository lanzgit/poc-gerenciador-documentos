# Credenciais do PostgreSQL — valores em Base64
# Para gerar: echo -n "valor" | base64
# gerenciador     → Z2VyZW5jaWFkb3I=
# gerenciador123  → Z2VyZW5jaWFkb3IxMjM=
# gerenciador_db  → Z2VyZW5jaWFkb3JfZGI=
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: gerenciador
type: Opaque
data:
  POSTGRES_DB:       Z2VyZW5jaWFkb3JfZGI=
  POSTGRES_USER:     Z2VyZW5jaWFkb3I=
  POSTGRES_PASSWORD: Z2VyZW5jaWFkb3IxMjM=
