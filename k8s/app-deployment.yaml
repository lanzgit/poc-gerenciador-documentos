# ── App Deployment ────────────────────────────────────────────────────────────
# Instrução 2a: 4 réplicas
# Instrução 2d: readinessProbe + livenessProbe via /actuator/health
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gerenciador-documentos
  namespace: gerenciador
  labels:
    app: gerenciador-documentos
spec:
  replicas: 4
  selector:
    matchLabels:
      app: gerenciador-documentos
  template:
    metadata:
      labels:
        app: gerenciador-documentos
    spec:
      containers:
        - name: gerenciador-documentos
          image: l4n5/gerenciador-documentos:1.2.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # ── Readiness Probe ──────────────────────────────────────────────────
          # O pod só recebe tráfego quando o Spring context estiver totalmente UP
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          # ── Liveness Probe ───────────────────────────────────────────────────
          # Reinicia o container se ele travar (ex.: deadlock)
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
# ── NodePort Service ─────────────────────────────────────────────────────────
# Instrução 2b: acessível fora do cluster via <NodeIP>:30080
apiVersion: v1
kind: Service
metadata:
  name: gerenciador-documentos-service
  namespace: gerenciador
spec:
  type: NodePort
  selector:
    app: gerenciador-documentos
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
