apiVersion: v1
data:
  gerenciador-documentos.json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": { "list": [] },
      "description": "Métricas da aplicação Gerenciador de Documentos — JVM, HTTP, CPU, Memória",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "JVM — Memória",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 2,
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{application=\"gerenciador-documentos\"}",
              "legendFormat": "{{area}} — {{id}}",
              "refId": "A"
            }
          ],
          "title": "Memória JVM Utilizada (bytes)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 3,
          "targets": [
            {
              "expr": "jvm_memory_max_bytes{application=\"gerenciador-documentos\",area=\"heap\"}",
              "legendFormat": "Max Heap — {{id}}",
              "refId": "A"
            },
            {
              "expr": "jvm_memory_used_bytes{application=\"gerenciador-documentos\",area=\"heap\"}",
              "legendFormat": "Heap Usado — {{id}}",
              "refId": "B"
            }
          ],
          "title": "Heap: Máximo vs Utilizado",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 10,
          "title": "CPU e Threads",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "id": 4,
          "targets": [
            {
              "expr": "process_cpu_usage{application=\"gerenciador-documentos\"}",
              "legendFormat": "CPU do Processo",
              "refId": "A"
            },
            {
              "expr": "system_cpu_usage{application=\"gerenciador-documentos\"}",
              "legendFormat": "CPU do Sistema",
              "refId": "B"
            }
          ],
          "title": "Uso de CPU",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "id": 5,
          "targets": [
            {
              "expr": "jvm_threads_live_threads{application=\"gerenciador-documentos\"}",
              "legendFormat": "Threads Ativas",
              "refId": "A"
            },
            {
              "expr": "jvm_threads_daemon_threads{application=\"gerenciador-documentos\"}",
              "legendFormat": "Threads Daemon",
              "refId": "B"
            }
          ],
          "title": "Threads JVM",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 11,
          "title": "HTTP — Requisições",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "id": 6,
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{application=\"gerenciador-documentos\"}[1m])",
              "legendFormat": "{{method}} {{uri}} — {{status}}",
              "refId": "A"
            }
          ],
          "title": "Requisições HTTP por segundo (1m)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "id": 7,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{application=\"gerenciador-documentos\"}[5m]))",
              "legendFormat": "p95 — {{uri}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{application=\"gerenciador-documentos\"}[5m]))",
              "legendFormat": "p99 — {{uri}}",
              "refId": "B"
            }
          ],
          "title": "Latência HTTP (p95 / p99)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 },
          "id": 12,
          "title": "Banco de Dados (HikariCP)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short",
              "min": 0
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "id": 8,
          "targets": [
            {
              "expr": "hikaricp_connections_active{application=\"gerenciador-documentos\"}",
              "legendFormat": "Conexões Ativas",
              "refId": "A"
            },
            {
              "expr": "hikaricp_connections_idle{application=\"gerenciador-documentos\"}",
              "legendFormat": "Conexões Ociosas",
              "refId": "B"
            },
            {
              "expr": "hikaricp_connections_pending{application=\"gerenciador-documentos\"}",
              "legendFormat": "Conexões Pendentes",
              "refId": "C"
            }
          ],
          "title": "Pool de Conexões HikariCP",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "id": 9,
          "targets": [
            {
              "expr": "hikaricp_connections_acquire_seconds_sum{application=\"gerenciador-documentos\"} / hikaricp_connections_acquire_seconds_count{application=\"gerenciador-documentos\"}",
              "legendFormat": "Tempo Médio de Aquisição",
              "refId": "A"
            }
          ],
          "title": "Tempo Médio de Aquisição de Conexão",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["spring-boot", "jvm", "gerenciador"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Gerenciador de Documentos",
      "uid": "gerenciador-documentos",
      "version": 1
    }
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: gerenciador
